<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ふたりの家計簿</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #292352; color: #f7f5fc; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  main { width: min(88vw, 360px); text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 14px; line-height: 1.7; opacity: .85; margin: 8px 0; }
  ol { text-align: left; font-size: 14px; line-height: 1.8; padding-left: 1.4em; }
  a.btn { display: block; margin: 20px 0 0; padding: 14px; border-radius: 14px; background: #d9fb63; color: #292352;
    font-weight: 700; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>ふたりの家計簿</h1>
  <div id="setup" hidden>
    <p>このページをホーム画面に追加すると、次からはアイコンから直接ひらけます。</p>
    <ol>
      <li>下の共有ボタン →「ホーム画面に追加」</li>
      <li>「Webアプリとして開く」をオフにする</li>
      <li>「追加」を押す</li>
    </ol>
    <a class="btn" id="go" href="#">いま開く</a>
  </div>
  <p id="none" hidden>行き先が設定されていません。受け取ったリンクから開き直してください。</p>
</main>
<script>
(function () {
  // 行き先は URL の # 以降で受け取り、この端末の中だけに覚える（このページ自体には書かない）
  var OK = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
  var get = function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  var set = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var hash = '';
  try { hash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  var saved = get('dest');
  var dest = OK.test(hash) ? hash : (OK.test(saved) ? saved : '');
  if (!dest) { document.getElementById('none').hidden = false; return; }
  var first = saved !== dest || !get('seen');
  set('dest', dest);
  if (first) { // 初回は追加の手順を見せる（すぐ移動するとホーム画面に追加できない）
    set('seen', '1');
    document.getElementById('go').href = dest;
    document.getElementById('setup').hidden = false;
    return;
  }
  location.replace(dest);
})();
</script>
</body>
</html>
