<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ふたりの家計簿</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #292352; color: #f7f5fc; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  main { width: min(88vw, 360px); text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 14px; line-height: 1.7; opacity: .85; margin: 8px 0; }
  ol { text-align: left; font-size: 14px; line-height: 1.8; padding-left: 1.4em; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 0; font-size: 14px; }
  #err { color: #ffb4a8; }
  button.btn { width: 100%; border: 0; font-size: 16px; }
  .btn { display: block; margin: 20px 0 0; padding: 14px; border-radius: 14px; background: #d9fb63; color: #292352;
    font-weight: 700; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>ふたりの家計簿</h1>
  <form id="form" hidden>
    <p>家計簿の URL を貼り付けてください（この端末の中だけに保存されます）。</p>
    <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    <p id="err" hidden>家計簿の URL ではないようです。Safari のアドレス欄からコピーし直してください。</p>
    <button class="btn" type="submit">設定する</button>
  </form>
  <div id="guide" hidden>
    <p><b>いま表示しているこのページ</b>を、ホーム画面に追加してください。</p>
    <ol>
      <li>共有ボタン →「ホーム画面に追加」</li>
      <li>アイコンがこの絵になっているのを確かめて「追加」</li>
    </ol>
    <a class="btn" id="go" href="#">追加できた（家計簿を開く）</a>
  </div>
  <p id="moving" hidden>家計簿を開いています…<br><a id="manual" href="#" style="color:#d9fb63">開かないときはここを押す</a></p>
</main>
<script>
(function () {
  // このページの役目: ホーム画面のアイコンを出すことと、家計簿へ移動すること。
  // 行き先は端末の中（と URL の # 以降）だけに持ち、このページ自体には書かない。
  // 決まり: 行き先を知っていれば、すぐ家計簿へ移動する。
  //         移動しないのは「設定中のタブ」（行き先を入力した直後、または ?setup で開いたタブ）の10分間だけ。
  //         URL の形（?open の有無・# の有無）や、端末に残した印には頼らない。
  var OK = /^https:\/\/script\.google\.com\/macros\/(u\/\d+\/)?s\/[A-Za-z0-9_-]+\/exec$/;
  var store = function (st) { return {
    get: function (k) { try { return st.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { st.setItem(k, v); } catch (e) {} } }; };
  var L = store(window.localStorage), T = store(window.sessionStorage);
  var $ = function (id) { return document.getElementById(id); };
  var hash = '';
  try { hash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  var dest = OK.test(hash) ? hash : (OK.test(L.get('dest')) ? L.get('dest') : '');
  var clean = function (d) { return location.pathname + '#' + encodeURIComponent(d); };
  var inSetup = function () { var t = Number(T.get('setup')) || 0; return t > 0 && Date.now() - t < 10 * 60 * 1000; };
  var go = function () {
    T.set('setup', '');
    $('form').hidden = true; $('guide').hidden = true; $('moving').hidden = false; $('manual').href = dest;
    location.replace(dest);
  };
  var guide = function () {
    $('form').hidden = true; $('guide').hidden = false; $('go').href = dest;
    $('go').addEventListener('click', function (e) { e.preventDefault(); go(); });
    // ホーム画面のアイコンを押すと、Safari が読み込み直さずにこのタブを前に出すだけのことがある。そのときも移動する
    var away = false;
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') away = true; else if (away) go();
    });
  };

  if (!dest) { // 行き先をまだ知らない: 貼り付けてもらう
    $('form').hidden = false;
    $('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = $('url').value.trim().split(/[?#]/)[0];
      if (!OK.test(v)) { $('err').hidden = false; return; }
      dest = v; L.set('dest', v);
      if (navigator.standalone === true) { go(); return; } // ホーム画面から Web アプリとして開いているなら、追加の案内は要らない
      T.set('setup', String(Date.now()));
      try { history.replaceState(null, '', clean(v)); } catch (err) {}
      guide();
    });
    return;
  }
  L.set('dest', dest);
  if (/[?&]setup\b/.test(location.search)) { // 追加をやり直したいとき用。きれいな URL に読み込み直してから案内を出す
    T.set('setup', String(Date.now())); location.replace(clean(dest)); return;
  }
  if (inSetup() && navigator.standalone !== true) { guide(); return; }
  go();
})();
</script>
</body>
</html>
