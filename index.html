<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ふたりの家計簿</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #292352; color: #f7f5fc; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  main { width: min(88vw, 360px); text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 14px; line-height: 1.7; opacity: .85; margin: 8px 0; }
  ol { text-align: left; font-size: 14px; line-height: 1.8; padding-left: 1.4em; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 0; font-size: 14px; }
  #err { color: #ffb4a8; }
  button.btn { width: 100%; border: 0; font-size: 16px; }
  .btn { display: block; margin: 20px 0 0; padding: 14px; border-radius: 14px; background: #d9fb63; color: #292352;
    font-weight: 700; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>ふたりの家計簿</h1>
  <form id="form" hidden>
    <p>家計簿の URL を貼り付けてください（この端末の中だけに保存されます）。</p>
    <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    <p id="err" hidden>家計簿の URL ではないようです。Safari のアドレス欄からコピーし直してください。</p>
    <button class="btn" type="submit">設定する</button>
  </form>
  <div id="guide" hidden>
    <p><b>いま表示しているこのページ</b>を、ホーム画面に追加してください。</p>
    <ol>
      <li>共有ボタン →「ホーム画面に追加」</li>
      <li>アイコンがこの絵になっているのを確かめる</li>
      <li>「Webアプリとして開く」をオフにして「追加」</li>
      <li>このページに戻って、下のボタンを押す</li>
    </ol>
    <button class="btn" id="added" type="button">追加できた</button>
    <p><a id="skip" href="#" style="color:#d9fb63">追加せずに家計簿を開く</a></p>
  </div>
  <div id="done" hidden>
    <p>設定が終わりました。次からはホーム画面のアイコンで家計簿が開きます。</p>
    <a class="btn" id="openNow" href="#">家計簿を開く</a>
  </div>
</main>
<script>
(function () {
  // このページの役目: ホーム画面のアイコンを出すことと、家計簿へ移動すること。
  // 行き先は端末の中（と URL の # 以降）だけに持ち、このページ自体には書かない。
  // ?open が付いていないとき（設定用）は、決して自動で移動しない。
  var OK = /^https:\/\/script\.google\.com\/macros\/(u\/\d+\/)?s\/[A-Za-z0-9_-]+\/exec$/;
  var get = function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  var set = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var $ = function (id) { return document.getElementById(id); };
  var hash = '';
  try { hash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  var dest = OK.test(hash) ? hash : (OK.test(get('dest')) ? get('dest') : '');
  var open = /[?&]open\b/.test(location.search);
  var launchUrl = function (d) { return location.pathname + '?open#' + encodeURIComponent(d); };

  if (!dest) { // 行き先をまだ知らない: 貼り付けてもらう
    $('form').hidden = false;
    $('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = $('url').value.trim().split(/[?#]/)[0];
      if (!OK.test(v)) { $('err').hidden = false; return; }
      set('dest', v); set('added', '');
      location.href = launchUrl(v); if (open) location.reload();
    });
    return;
  }
  set('dest', dest);
  if (!open) { set('added', ''); location.replace(launchUrl(dest)); return; } // 設定用で開いたら、追加の案内からやり直す（家計簿へは移動しない）
  // ホーム画面から開いたとき: Web アプリとして開いた場合（standalone）か、追加が済んだ端末なら移動する
  if (navigator.standalone === true || get('added') === '1') { location.replace(dest); return; }
  // ホーム画面のアイコンを押すと、Safari が読み込み直さずにこのタブを前に出すだけのことがある。
  // 追加が済んだあとでこのタブが再び表示されたら、そこで家計簿へ移動する
  var away = false;
  var back = function () { if (get('added') === '1') location.replace(dest); };
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') away = true; else if (away) back();
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) back(); });
  $('openNow').href = dest;
  $('guide').hidden = false;
  $('skip').href = dest;
  $('added').addEventListener('click', function () { set('added', '1'); $('guide').hidden = true; $('done').hidden = false; });
})();
</script>
</body>
</html>
